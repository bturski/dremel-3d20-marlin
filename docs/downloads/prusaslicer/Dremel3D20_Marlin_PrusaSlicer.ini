# PrusaSlicer config bundle for the Dremel 3D20 running Marlin 2 (moonglow FlashForge_Marlin).
# Import with File > Import > Import Config Bundle.
# Guide: https://bturski.github.io/dremel-3d20-marlin/slicers/prusaslicer/
# Generated by scripts/build_profiles.py. Edit that script, not this file.

[print:Dremel 3D20 Marlin 0.20mm QUALITY]
layer_height = 0.2
first_layer_height = 0.25
perimeters = 2
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = gyroid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
seam_position = aligned
skirts = 2
skirt_distance = 3
skirt_height = 1
brim_width = 0
elefant_foot_compensation = 0.1
support_material = 0
perimeter_speed = 40
small_perimeter_speed = 20
external_perimeter_speed = 30
infill_speed = 60
solid_infill_speed = 45
top_solid_infill_speed = 30
support_material_speed = 40
support_material_interface_speed = 100%
bridge_speed = 30
gap_fill_speed = 25
ironing_speed = 15
travel_speed = 120
travel_speed_z = 0
first_layer_speed = 20
default_acceleration = 800
external_perimeter_acceleration = 500
perimeter_acceleration = 800
infill_acceleration = 1000
solid_infill_acceleration = 800
top_solid_infill_acceleration = 600
bridge_acceleration = 500
first_layer_acceleration = 300
travel_acceleration = 1000
gcode_label_objects = octoprint
arc_fitting = emit_center
gcode_comments = 0
output_filename_format = {input_filename_base}_{layer_height}mm_{printing_filament_types}_{print_time}.gcode
compatible_printers = 
compatible_printers_condition = printer_notes=~/.*DREMEL3D20MARLIN.*/

[filament:Dremel 3D20 Marlin PLA]
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.24
filament_cost = 20
extrusion_multiplier = 1
temperature = 210
first_layer_temperature = 215
bed_temperature = 0
first_layer_bed_temperature = 0
filament_max_volumetric_speed = 7
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
full_fan_speed_layer = 0
fan_below_layer_time = 60
slowdown_below_layer_time = 10
min_print_speed = 10
filament_notes = Starting point for PLA on the unheated stock bed. Keep the nozzle at or below 230 C.
compatible_printers = 
compatible_printers_condition = printer_notes=~/.*DREMEL3D20MARLIN.*/

[printer:Dremel 3D20 Marlin]
printer_technology = FFF
printer_model = 
printer_vendor = 
printer_notes = DREMEL3D20MARLIN\nDremel 3D20 running moonglow FlashForge_Marlin 2.0.9.x. Origin is the bed center.
bed_shape = -115x-75,115x-75,115x75,-115x75
max_print_height = 140
z_offset = 0
gcode_flavor = marlin2
binary_gcode = 0
remaining_times = 0
use_relative_e_distances = 1
autoemit_temperature_commands = 0
thumbnails = 
silent_mode = 0
machine_limits_usage = time_estimate_only
machine_max_feedrate_x = 300,300
machine_max_feedrate_y = 300,300
machine_max_feedrate_z = 20,20
machine_max_feedrate_e = 27,27
machine_max_acceleration_x = 1000,1000
machine_max_acceleration_y = 1000,1000
machine_max_acceleration_z = 150,150
machine_max_acceleration_e = 4000,4000
machine_max_acceleration_extruding = 1000,1000
machine_max_acceleration_retracting = 1000,1000
machine_max_acceleration_travel = 1000,1000
machine_max_jerk_x = 10,10
machine_max_jerk_y = 10,10
machine_max_jerk_z = 0.3,0.3
machine_max_jerk_e = 5,5
machine_min_extruding_rate = 0,0
machine_min_travel_rate = 0,0
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
retract_length = 1
retract_speed = 25
deretract_speed = 20
retract_restart_extra = 0
retract_before_travel = 1.5
retract_layer_change = 1
wipe = 1
retract_before_wipe = 70%
retract_lift = 0.2
retract_lift_above = 0
retract_lift_below = 0
travel_ramping_lift = 0
layer_gcode = 
before_layer_gcode = 
start_gcode = ; Dremel 3D20 + Marlin 2 start G-code for PrusaSlicer\n; Uses relative extrusion (M83). Turn on "Use relative E distances" in Printer Settings.\nG90                               ; absolute XYZ moves\nM83                               ; relative extrusion\nM107                              ; part fan off\nM104 S[first_layer_temperature]   ; start heating the nozzle\nG28                               ; home X and Y to max, Z to min\nM420 S1                           ; turn on the saved mesh (delete this line if you have not saved one)\nG1 Z10 F800                       ; lower the bed\nG1 X-108 Y-70 F3000               ; move to the front left corner\nM109 S[first_layer_temperature]   ; wait for the nozzle to reach temperature\nG1 Z0.3 F800\nG1 Y60 E10 F1200                  ; purge line 1\nG1 X-107.4 F1200\nG1 Y-60 E8 F1200                  ; purge line 2\nG1 E-0.8 F1500                    ; small retract\nG1 Z2 F800\nG92 E0
end_gcode = ; Dremel 3D20 + Marlin 2 end G-code for PrusaSlicer\nG1 E-2 F1500                          ; retract\nM104 S0                               ; nozzle heater off\nM107                                  ; part fan off\nG1 Z{min(max_layer_z + 10, 140)} F800 ; lower the bed away from the part\nG28 X Y                               ; park at the back right\nM84                                   ; motors off

[presets]
print = Dremel 3D20 Marlin 0.20mm QUALITY
filament = Dremel 3D20 Marlin PLA
printer = Dremel 3D20 Marlin
